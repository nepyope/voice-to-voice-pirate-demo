name: pirate-voice
services:
  llm:
    image: ${VLLM_LLM_IMAGE:-vllm/vllm-openai:v0.29.0-cu129}
    gpus: [{driver: nvidia, count: all}]
    ipc: host
    init: true
    entrypoint: ["vllm", "serve"]
    command: ["${LLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}",
              "--host", "0.0.0.0", "--port", "8000", "--dtype", "half",
              "--max-model-len", "${LLM_MAX_MODEL_LEN:-4096}",
              "--max-num-seqs", "${LLM_MAX_NUM_SEQS:-4}",
              "--gpu-memory-utilization", "${LLM_GPU_MEMORY_UTILIZATION:-0.45}",
              "--enforce-eager"]
    environment:
      HF_HOME: /cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      # The cu129 image declares cuda>=12.9 and the container toolkit refuses to start it on
      # older drivers; skip the label check.
      NVIDIA_DISABLE_REQUIRE: ${NVIDIA_DISABLE_REQUIRE:-1}
    volumes:
      - hf-cache:/cache/huggingface
    # The image bundles CUDA forward-compat libs (libcuda.so.575) that only work on
    # datacenter GPUs; on GeForce they cause "Error 804". Hide them so the host driver is used.
    tmpfs:
      - /usr/local/cuda/compat
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30m
      retries: 4
  s2s:
    image: pirate-voice-backend:local
    build:
      context: .
      dockerfile: Dockerfile.backend
    gpus: [{driver: nvidia, count: all}]
    init: true
    volumes:
      - ./voices:/voices:ro
      - hf-cache:/cache/huggingface
      - torch-cache:/cache/torch
      - ./artifacts:/artifacts
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      TORCH_HOME: /cache/torch
      NUM_PIPELINES: ${NUM_PIPELINES:-1}
      TTS_MODEL: k2-fsa/OmniVoice
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}
      LLM_BASE_URL: http://llm:8000/v1
      OPENAI_API_KEY: local-demo
      HF_HUB_DISABLE_TELEMETRY: "1"
    depends_on:
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/v1/pool', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30m
      retries: 4
    stop_grace_period: 30s
  ui:
    build: ./hf-realtime-voice
    init: true
    ports:
      - "${UI_BIND:-127.0.0.1}:${UI_PORT:-7860}:7860"
    environment:
      SPEECH_TO_SPEECH_URL: ws://s2s:8765/v1/realtime
      STARTUP_GREETING: ""
    depends_on:
      s2s:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/api/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
volumes:
  hf-cache:
  torch-cache:
networks:
  # Pinned subnet: Docker's defaults (172.18.0.0/16, 172.20.0.0/17) collide with routes
  # advertised on the HF Tailscale tailnet, which silently blackholes container traffic.
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.30.0.0/24}
