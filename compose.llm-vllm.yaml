# Add to either local TTS or compose.vllm.yaml. No host port is exposed.
services:
  llm:
    image: ${VLLM_LLM_IMAGE:-vllm/vllm-openai:v0.29.0-cu129}
    gpus: [{driver: nvidia, count: all}]
    ipc: host
    init: true
    entrypoint: ["vllm", "serve"]
    command: ["${LLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}",
              "--host", "0.0.0.0", "--port", "8000", "--dtype", "half",
              "--max-model-len", "${LLM_MAX_MODEL_LEN:-4096}",
              "--max-num-seqs", "${LLM_MAX_NUM_SEQS:-4}",
              "--gpu-memory-utilization", "${LLM_GPU_MEMORY_UTILIZATION:-0.45}",
              "--enforce-eager"]
    environment:
      HF_HOME: /cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      # The cu129 image declares cuda>=12.9; on a 570 (CUDA 12.8) driver the container
      # toolkit refuses to start it. CUDA 12.x minor-version compatibility lets it run
      # anyway, so skip the label check. Set to 0 on a 575+ driver.
      NVIDIA_DISABLE_REQUIRE: ${NVIDIA_DISABLE_REQUIRE:-1}
    volumes:
      - hf-cache:/cache/huggingface
    # The image bundles CUDA forward-compat libs (libcuda.so.575) that only work on
    # datacenter GPUs; on GeForce they cause "Error 804". Hide them so the host driver is used.
    tmpfs:
      - /usr/local/cuda/compat
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30m
      retries: 4
  s2s:
    environment:
      LLM_BASE_URL: http://llm:8000/v1
      OPENAI_API_KEY: local-demo
    depends_on:
      llm:
        condition: service_healthy
